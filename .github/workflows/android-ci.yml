name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vulnerability-scan:
    name: Scan locked dependencies for known vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=osv-scanner:osv-scanner-custom.json
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  verify:
    name: Verify non-production build
    needs: vulnerability-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Temurin 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Install pinned Android build packages
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$BOOTSTRAP_SDKMANAGER"
          "$BOOTSTRAP_SDKMANAGER" 'cmdline-tools;20.0'
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager"
          TOOLS_PROPERTIES="$ANDROID_HOME/cmdline-tools/20.0/source.properties"
          test -x "$SDKMANAGER"
          grep -Fxq 'Pkg.Revision=20.0' "$TOOLS_PROPERTIES"
          grep -Fxq 'Pkg.Path=cmdline-tools;20.0' "$TOOLS_PROPERTIES"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Verify tests, lint, artifacts, R8, licenses, and workspace security
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            :app:testDebugUnitTest \
            :app:testQaUnitTest \
            :app:testReleaseUnitTest \
            :app:lintDebug \
            :app:lintQa \
            :app:lintRelease \
            :app:verifyStoreAssets \
            :app:verifyAssetRightsEvidenceValidatorContract \
            :app:assembleDebug \
            :app:assembleQa \
            :app:minifyReleaseWithR8 \
            :app:verifyReleaseResourceSize \
            :verifyReleaseSecurityEvidence

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/release-security/

  # production-release.yml requires these API 35 results, plus the API boundary
  # results below, from a successful push run for the exact release commit.
  # Hash-bound physical Samsung QA evidence remains a separate release gate.
  managed-device-smoke:
    name: Critical QA smoke (managed device)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Temurin 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install pinned Android build packages
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$BOOTSTRAP_SDKMANAGER"
          "$BOOTSTRAP_SDKMANAGER" 'cmdline-tools;20.0'
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager"
          TOOLS_PROPERTIES="$ANDROID_HOME/cmdline-tools/20.0/source.properties"
          test -x "$SDKMANAGER"
          grep -Fxq 'Pkg.Revision=20.0' "$TOOLS_PROPERTIES"
          grep -Fxq 'Pkg.Path=cmdline-tools;20.0' "$TOOLS_PROPERTIES"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'emulator'
          EMULATOR_PROPERTIES="$ANDROID_HOME/emulator/source.properties"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/emulator/emulator"
          grep -Fxq 'Pkg.Revision=37.1.11' "$EMULATOR_PROPERTIES"
          grep -Fxq 'Pkg.Path=emulator' "$EMULATOR_PROPERTIES"

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Register CI managed device
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v-slot-managed-device.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.pluginManager.withPlugin("com.android.application") {
                  if (project.path == ":app") {
                      def android = project.extensions.getByName("android")
                      android.testOptions.managedDevices.localDevices.create("ciPixel2Api35") {
                          device = "Pixel 2"
                          apiLevel = 35
                          systemImageSource = "aosp-atd"
                          testedAbi = "x86_64"
                      }
                  }
              }
          }
          GRADLE

      - name: Run critical QA smoke on managed device
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            --init-script "$RUNNER_TEMP/v-slot-managed-device.init.gradle" \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.class=com.vslot.app.MainActivitySmokeTest#firstLaunchShowsDisclaimerAndOpensDailyBonusOnlyAfterTap,com.vslot.app.MainActivitySmokeTest#homeNavigationOpensSlotPaytableSettingsAndPrivacyFallback,com.vslot.app.MainActivitySmokeTest#directRomanSlotKeepsLinesTotalBetAndAutoSpinControlsStableAfterRecreate,com.vslot.app.MainActivitySmokeTest#freeSpinsModeUsesFreeSpinCopyAndLocksStakeControls,com.vslot.app.MainActivitySmokeTest#recreatingActivityDuringPaidSpinSettlesExactlyOnce \
            :app:ciPixel2Api35QaAndroidTest

      - name: Upload managed-device smoke reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-managed-device-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/managedDevice/
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/

  managed-device-sdk-boundaries:
    name: Runtime SDK boundary smoke (API ${{ matrix.api }})
    if: ${{ github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Temurin 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install pinned Android build packages
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$BOOTSTRAP_SDKMANAGER"
          "$BOOTSTRAP_SDKMANAGER" 'cmdline-tools;20.0'
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager"
          TOOLS_PROPERTIES="$ANDROID_HOME/cmdline-tools/20.0/source.properties"
          test -x "$SDKMANAGER"
          grep -Fxq 'Pkg.Revision=20.0' "$TOOLS_PROPERTIES"
          grep -Fxq 'Pkg.Path=cmdline-tools;20.0' "$TOOLS_PROPERTIES"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'emulator'
          EMULATOR_PROPERTIES="$ANDROID_HOME/emulator/source.properties"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/emulator/emulator"
          grep -Fxq 'Pkg.Revision=37.1.11' "$EMULATOR_PROPERTIES"
          grep -Fxq 'Pkg.Path=emulator' "$EMULATOR_PROPERTIES"

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Register CI managed device
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v-slot-managed-device.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.pluginManager.withPlugin("com.android.application") {
                  if (project.path == ":app") {
                      def android = project.extensions.getByName("android")
                      android.testOptions.managedDevices.localDevices.create("ciPixel2Api${{ matrix.api }}") {
                          device = "Pixel 2"
                          apiLevel = ${{ matrix.api }}
                          systemImageSource = (${{ matrix.api }} == 36) ? "aosp-atd" : "aosp"
                          testedAbi = "x86_64"
                      }
                  }
              }
          }
          GRADLE

      - name: Run critical QA smoke at the runtime SDK boundary
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            --init-script "$RUNNER_TEMP/v-slot-managed-device.init.gradle" \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            -Pandroid.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.class=com.vslot.app.MainActivitySmokeTest#firstLaunchShowsDisclaimerAndOpensDailyBonusOnlyAfterTap,com.vslot.app.MainActivitySmokeTest#homeNavigationOpensSlotPaytableSettingsAndPrivacyFallback,com.vslot.app.MainActivitySmokeTest#directRomanSlotKeepsLinesTotalBetAndAutoSpinControlsStableAfterRecreate,com.vslot.app.MainActivitySmokeTest#freeSpinsModeUsesFreeSpinCopyAndLocksStakeControls,com.vslot.app.MainActivitySmokeTest#recreatingActivityDuringPaidSpinSettlesExactlyOnce \
            :app:ciPixel2Api${{ matrix.api }}QaAndroidTest

      - name: Upload managed-device boundary reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-managed-device-boundary-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/managedDevice/
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/

  managed-device-full:
    name: Full QA instrumentation (managed device)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Temurin 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'schedule' }}

      - name: Install pinned Android build packages
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$BOOTSTRAP_SDKMANAGER"
          "$BOOTSTRAP_SDKMANAGER" 'cmdline-tools;20.0'
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager"
          TOOLS_PROPERTIES="$ANDROID_HOME/cmdline-tools/20.0/source.properties"
          test -x "$SDKMANAGER"
          grep -Fxq 'Pkg.Revision=20.0' "$TOOLS_PROPERTIES"
          grep -Fxq 'Pkg.Path=cmdline-tools;20.0' "$TOOLS_PROPERTIES"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'emulator'
          EMULATOR_PROPERTIES="$ANDROID_HOME/emulator/source.properties"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/emulator/emulator"
          grep -Fxq 'Pkg.Revision=37.1.11' "$EMULATOR_PROPERTIES"
          grep -Fxq 'Pkg.Path=emulator' "$EMULATOR_PROPERTIES"

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Register CI managed device
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v-slot-managed-device.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.pluginManager.withPlugin("com.android.application") {
                  if (project.path == ":app") {
                      def android = project.extensions.getByName("android")
                      android.testOptions.managedDevices.localDevices.create("ciPixel2Api35") {
                          device = "Pixel 2"
                          apiLevel = 35
                          systemImageSource = "aosp-atd"
                          testedAbi = "x86_64"
                      }
                  }
              }
          }
          GRADLE

      - name: Run full QA instrumentation suite on managed device
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            --init-script "$RUNNER_TEMP/v-slot-managed-device.init.gradle" \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.vslot.app.SlotFrameMetricsTest \
            :app:ciPixel2Api35QaAndroidTest

      - name: Upload managed-device full-suite reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-managed-device-full-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/managedDevice/
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
