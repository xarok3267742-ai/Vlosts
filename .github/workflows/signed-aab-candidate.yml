name: Signed AAB Candidate

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Confirm the Android versionCode to build
        required: true
        type: string

concurrency:
  group: signed-aab-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  require-main-ci:
    name: Require complete Android CI for main commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Verify protected main and successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_PROTECTED" = 'true'

          runs_json="$(
            gh api --method GET \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/android-ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f per_page=100
          )"
          run_id="$(
            printf '%s\n' "$runs_json" | jq --exit-status --raw-output \
              --arg sha "$GITHUB_SHA" '
                [
                  .workflow_runs[]
                  | select(
                      .head_sha == $sha
                      and .head_branch == "main"
                      and .event == "push"
                      and .status == "completed"
                      and .conclusion == "success"
                    )
                ]
                | sort_by(.run_attempt, .id)
                | last
                | .id
              '
          )"
          jobs_json="$(
            gh api --paginate --method GET \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              -f filter=latest \
              -f per_page=100
          )"

          if ! printf '%s\n' "$jobs_json" | jq --exit-status --slurp '
            def passed($name):
              any(.[].jobs[];
                .name == $name
                and .status == "completed"
                and .conclusion == "success"
              );
            passed("Verify non-production build")
            and passed("Critical QA smoke (managed device)")
            and passed("Runtime SDK boundary smoke (API 26)")
            and passed("Runtime SDK boundary smoke (API 36)")
          ' > /dev/null; then
            printf 'Required Android CI jobs did not all pass for %s in run %s.\n' \
              "$GITHUB_SHA" "$run_id" >&2
            exit 1
          fi

          printf 'Android CI run %s passed for %s.\n' "$run_id" "$GITHUB_SHA"

  build:
    name: Build and verify signed AAB candidate
    needs: require-main-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      V_SLOT_RELEASE_KEY_ALIAS: ${{ vars.V_SLOT_RELEASE_KEY_ALIAS }}
      V_SLOT_RELEASE_CERT_SHA256: ${{ vars.V_SLOT_RELEASE_CERT_SHA256 }}

    steps:
      - name: Check out protected source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release source and requested version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_PROTECTED" = 'true'
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          actual_version_code="$(
            sed -n 's/^val vSlotVersionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts
          )"
          test -n "$actual_version_code"
          test "$actual_version_code" = '${{ inputs.version_code }}'

      - name: Set up Temurin 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install pinned Android build packages
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$BOOTSTRAP_SDKMANAGER"
          "$BOOTSTRAP_SDKMANAGER" 'cmdline-tools;20.0'
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Install reviewed bundletool
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bundletool-all-1.18.3.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          test "$(sha256sum "$RUNNER_TEMP/bundletool-all-1.18.3.jar" | awk '{print $1}')" = \
            a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          chmod 0444 "$RUNNER_TEMP/bundletool-all-1.18.3.jar"

      - name: Materialize and verify upload key
        shell: bash
        env:
          V_SLOT_RELEASE_KEYSTORE_BASE64: ${{ secrets.V_SLOT_RELEASE_KEYSTORE_BASE64 }}
          V_SLOT_RELEASE_STORE_PASSWORD: ${{ secrets.V_SLOT_RELEASE_STORE_PASSWORD }}
          V_SLOT_RELEASE_KEY_PASSWORD: ${{ secrets.V_SLOT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$V_SLOT_RELEASE_KEYSTORE_BASE64"
          test -n "$V_SLOT_RELEASE_STORE_PASSWORD"
          test -n "$V_SLOT_RELEASE_KEY_PASSWORD"
          test -n "$V_SLOT_RELEASE_KEY_ALIAS"
          test -n "$V_SLOT_RELEASE_CERT_SHA256"
          printf '%s' "$V_SLOT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/v-slot-upload.jks"
          chmod 0600 "$RUNNER_TEMP/v-slot-upload.jks"
          actual_certificate_sha256="$(
            keytool -exportcert \
              -keystore "$RUNNER_TEMP/v-slot-upload.jks" \
              -storepass:env V_SLOT_RELEASE_STORE_PASSWORD \
              -alias "$V_SLOT_RELEASE_KEY_ALIAS" \
              | sha256sum | awk '{print $1}'
          )"
          test "$actual_certificate_sha256" = "$V_SLOT_RELEASE_CERT_SHA256"

      - name: Build signed candidate
        shell: bash
        env:
          V_SLOT_RELEASE_STORE_FILE: ${{ runner.temp }}/v-slot-upload.jks
          V_SLOT_RELEASE_STORE_PASSWORD: ${{ secrets.V_SLOT_RELEASE_STORE_PASSWORD }}
          V_SLOT_RELEASE_KEY_PASSWORD: ${{ secrets.V_SLOT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            :app:testSignedCandidateUnitTest \
            :app:lintSignedCandidate \
            :app:verifyStoreAssets \
            :app:bundleSignedCandidate \
            :verifyReleaseSecurityEvidence

      - name: Verify AAB identity and signature
        shell: bash
        run: |
          set -euo pipefail
          source_aab='app/build/outputs/bundle/signedCandidate/app-signedCandidate.aab'
          output_dir='build/signed-candidate'
          output_aab="$output_dir/v-slot-${{ inputs.version_code }}-${GITHUB_SHA}.aab"
          manifest_file="$output_dir/base-manifest.xml"
          bundletool_file="$output_dir/bundletool-validation.txt"
          evidence_file="$output_dir/signed-candidate-evidence.txt"
          test -s "$source_aab"
          mkdir -p "$output_dir"
          cp "$source_aab" "$output_aab"

          verification_output="$(jarsigner -verify "$output_aab" 2>&1)"
          test "$verification_output" != "${verification_output%jar verified.*}"
          signer_block="$(
            zipinfo -1 "$output_aab" | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$'
          )"
          test "$(printf '%s\n' "$signer_block" | wc -l | tr -d ' ')" = 1
          unzip -p "$output_aab" "$signer_block" > "$output_dir/signer-block.bin"
          actual_certificate_sha256="$(
            keytool -printcert -file "$output_dir/signer-block.bin" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | head -n 1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          test "$actual_certificate_sha256" = "$V_SLOT_RELEASE_CERT_SHA256"
          rm -f "$output_dir/signer-block.bin"

          java -jar "$RUNNER_TEMP/bundletool-all-1.18.3.jar" validate \
            --bundle "$output_aab" > "$bundletool_file"
          java -jar "$RUNNER_TEMP/bundletool-all-1.18.3.jar" dump manifest \
            --bundle "$output_aab" --module base > "$manifest_file"
          grep -Eq 'package="com\.vslot\.app"' "$manifest_file"
          grep -Eq 'android:versionCode="${{ inputs.version_code }}"' "$manifest_file"
          if grep -Eq 'android:(debuggable|testOnly)="true"' "$manifest_file"; then
            echo 'Candidate must not be debuggable or testOnly.' >&2
            exit 1
          fi

          aab_sha256="$(sha256sum "$output_aab" | awk '{print $1}')"
          {
            printf 'schema=v-slot-signed-candidate-v1\n'
            printf 'application-id=com.vslot.app\n'
            printf 'version-code=%s\n' '${{ inputs.version_code }}'
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'github-run-id=%s\n' "$GITHUB_RUN_ID"
            printf 'aab-sha256=%s\n' "$aab_sha256"
            printf 'upload-certificate-sha256=%s\n' "$actual_certificate_sha256"
            printf 'production-readiness=NOT_EVALUATED\n'
            printf 'status=PASS\n'
          } > "$evidence_file"

      - name: Remove upload key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/v-slot-upload.jks"

      - name: Attest signed candidate
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            build/signed-candidate/*.aab
            build/signed-candidate/signed-candidate-evidence.txt
            build/signed-candidate/base-manifest.xml
            build/signed-candidate/bundletool-validation.txt

      - name: Upload signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v-slot-signed-candidate-${{ inputs.version_code }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/signed-candidate/
            app/build/reports/lint-results-signedCandidate.*
            app/build/outputs/mapping/signedCandidate/mapping.txt
