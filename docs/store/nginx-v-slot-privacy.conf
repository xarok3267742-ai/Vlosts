# Included inside the HTTPS server block for 139-100-227-46.nip.io.
location = /v-slot/privacy {
    alias /var/www/v-slot/privacy-policy.html;
    default_type text/html;
    charset utf-8;
    access_log off;
    limit_except GET HEAD { deny all; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Content-Language "ru" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location = /v-slot/privacy/ {
    return 308 /v-slot/privacy;
}
